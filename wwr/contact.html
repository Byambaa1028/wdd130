<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting for questions, reservations, and rafting information.">
    <meta name="author" content="Byambadulam B">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rafting Company Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h1>Contact White Water Rafting</h1>

            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>Phone: +1 999 999 9999</p>
            <p>Email: info@whitewater.com</p>
        </section>

        <section class="contact-area">
            <div class="map">
                <iframe
                    src="https://www.google.com/maps?q=Kolob%20California&output=embed"
                    width="400"
                    height="350"
                    loading="lazy"
                    title="White Water Rafting location">
                </iframe>
            </div>

            <form>
                <div class="form-item">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname">
                </div>

                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <label>
                        <input type="radio" name="purpose" value="general">
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </div>

                <div class="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">
                <figure>
                    <img src="images/employee1.jpg" alt="Rafting guide">
                    <figcaption>Sarah - Lead Rafting Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Customer service employee">
                    <figcaption>James - Customer Service</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Rafting manager">
                    <figcaption>Emily - Trip Manager</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 White Water Rafting | Byambadulam B</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
